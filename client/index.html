<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Crawlers read this file without running JavaScript, so the home page's
       full SEO head lives here statically. Seo.jsx only rewrites it when the
       router moves to a different route (e.g. /account -> noindex). -->
  <title>Software Company in Budbud — Zen OS POS &amp; eZentix Labs</title>
  <meta name="description" content="Discover billing software, restaurant POS and website development in Budbud with eZentix Labs. Built for local businesses in West Bengal. Book a demo." />
  <link rel="canonical" href="%ORIGIN%/" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <meta name="theme-color" content="#5F259F" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <meta property="og:site_name" content="eZentix Labs" />
  <meta property="og:title" content="eZentix Labs — Bring Your Offline Business Online" />
  <meta property="og:description" content="We sort the chaos of your offline business and transition you seamlessly online — Zen OS billing, online presence, and guidance in one subscription." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="%ORIGIN%/" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:locale:alternate" content="bn_IN" />
  <meta property="og:locale:alternate" content="hi_IN" />
  <meta property="og:image" content="%ORIGIN%/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="eZentix Labs — powered by AI, guided by technical experts" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="eZentix Labs — Bring Your Offline Business Online" />
  <meta name="twitter:description" content="Zen OS billing, online presence, and business guidance in one subscription. Budbud, West Bengal." />
  <meta name="twitter:image" content="%ORIGIN%/og-image.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Mooxy is referenced from the stylesheet, so without this it is only
       discovered once the CSS has been parsed. crossorigin is required even
       same-origin: font fetches are CORS-mode, and a mismatch downloads twice. -->
  <link rel="preload" as="font" type="font/ttf" href="/fonts/Mooxy.ttf" crossorigin />
  <!-- The font CSS is fetched without blocking first paint, then promoted to a
       real stylesheet once it lands. The families already carry display=swap,
       so text is painted in the fallback immediately either way; this just stops
       the round trip from holding up render. <noscript> keeps it working with
       JavaScript disabled. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all';this.onload=null" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" /></noscript>

  <!-- Route metadata and JSON-LD are generated by src/seo/head.js. -->
</head>
<body>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
